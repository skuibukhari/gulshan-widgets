plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gulshanfactory.widgets'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gulshanfactory.widgets'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Intentionally NO dependencies: the app uses only the Android framework
// (android.app.Activity, android.appwidget, android.widget.RemoteViews),
// so the build cannot fail resolving libraries.
